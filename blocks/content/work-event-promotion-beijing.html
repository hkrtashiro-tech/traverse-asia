<!-- wp:ta/work-221f64 {"data":{"f1":[{"f1":"背景・課題","f2":"在中国日本国大使館が主催する天皇誕生日祝賀レセプションを、日本各地の「食」「観光」「文化」を海外の来場者に体験してもらう場として活用しました。コロナ禍や輸入規制の影響で落ち込んだ訪日意欲と日本産品への関心を回復させ、地域への理解と信頼を高めることが課題でした。","_v":0},{"f1":"取り組み","f2":"全国17の自治体と30以上の企業が参加。自治体による観光PRや物産紹介、企業の飲食・地域食材のブース、和楽器（筝・尺八）の演奏、茶室体験、日本酒・焼酎の飲み比べなど、五感で体験する日本紹介を構成しました。大阪・関西万博のPR展示やインフルエンサーによる現地レポートで会場の外にも発信し、大使館の公式Weibo・WeChatと中国のインフルエンサーを通じて、現場の様子をリアルタイムで届けました。","f3":[{"f1":"会場構成","_v":0},{"f1":"自治体・企業ブースの運営","_v":0},{"f1":"ステージプログラム","_v":0},{"f1":"茶室体験","_v":0},{"f1":"インフルエンサー招聘","_v":0},{"f1":"Weibo・WeChatでの発信","_v":0}],"_v":1},{"f1":"成果","f2":"当日は中国在住の中国人、日本人、各国の外交団など約1,050名が来場しました。関連投稿の総閲覧数は40万回を超え、SNSには「また行きたい」「知らなかった地域に興味を持った」などのコメントが多く寄せられました。","_v":0},{"f1":"支援したステップ","f2":"/services/connect/","f3":"03 CONNECT","f4":[{"f1":"font-size: 19px; font-weight: 700;","f2":"現地とつなぐ","_v":0},{"f1":"font-size: 14px; color: #2E3D39;","f2":"代理店・ディストリビューター開拓、バイヤー商談、展示会・イベント、現地プロモーション","_v":0}],"_v":2}]}} /-->
