<!-- wp:ta/work-5fa401 {"data":{"f1":[{"f1":"背景・課題","f2":"ポニーキャニオンは、多くのIPを持つエンターテインメント企業です。海外で自然に流行している日本の楽曲を、さらに広めたいと考えていました。ただし宣伝するのは「楽曲」なので、商品紹介のような見せ方は向きません。","_v":0},{"f1":"取り組み","f2":"当社のインフルエンサーネットワークから、InstagramやTikTokでフィリピンの若者に人気のクリエイターを起用しました。Vlogのような形で日常のコンテンツを撮影してもらい、その中で楽曲を使うことで、無理に宣伝せず「聞いたことがある」という認知をつくることを目指しました。","f3":[{"f1":"クリエイターの選定","_v":0},{"f1":"Instagram","_v":0},{"f1":"TikTok","_v":0},{"f1":"Vlog形式のコンテンツ","_v":0},{"f1":"効果測定","_v":0}],"_v":1},{"f1":"成果","f2":"3人のインフルエンサーで、88,408のオーガニックリーチと7,100のエンゲージメントを記録しました。エンゲージメント率は8%を超え、コメント欄からも楽曲に好意的な印象を持ってもらえたことが分かりました。","_v":0},{"f1":"支援したステップ","f2":[{"f1":"/services/create/","f2":"01 CREATE","f3":[{"f1":"font-size: 19px; font-weight: 700;","f2":"ブランドをつくる","_v":0},{"f1":"font-size: 14px; color: #2E3D39;","f2":"ブランド戦略、コンセプト・ストーリー、ネーミング・パッケージ、多言語コンテンツ","_v":0}],"_v":0},{"f1":"/services/connect/","f2":"03 CONNECT","f3":[{"f1":"font-size: 19px; font-weight: 700;","f2":"現地とつなぐ","_v":0},{"f1":"font-size: 14px; color: #2E3D39;","f2":"代理店・ディストリビューター開拓、バイヤー商談、展示会・イベント、現地プロモーション","_v":0}],"_v":0}],"_v":2}]}} /-->
