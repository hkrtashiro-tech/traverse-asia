<!-- wp:ta/work-221f64 {"data":{"f1":[{"f1":"背景・課題","f2":"北海道産の活貝（ホタテ、北寄貝など）は、国内外で高く評価されています。2024年、シンガポール政府による活貝の輸入認可を受け、北海道庁の主導でシンガポールと台湾での本格的な市場開拓が始まりました。認知の向上や新しい販路づくりに加え、品質管理・物流体制の構築、飲食店・バイヤーとの関係づくりが求められました。","_v":0},{"f1":"取り組み","f2":"まず現地の衛生基準に沿った衛生証明書の取得とテスト輸送を行い、鮮度と品質を保てる体制を確認しました。シンガポール中心部の日系レストランと組んで、活貝を使ったスペシャルメニューを期間限定で展開し、一般の方向けの試食イベントを開催。現地の有力バイヤーとの意見交換会や、インフルエンサー・メディアの招請も行いました。中国語に堪能なスタッフが、現地パートナーや消費者とのやり取りと現場運営を支えました。","f3":[{"f1":"衛生証明書の取得","_v":0},{"f1":"テスト輸送","_v":0},{"f1":"レストランでの限定メニュー","_v":0},{"f1":"試食イベント","_v":0},{"f1":"バイヤーとの意見交換会","_v":0},{"f1":"インフルエンサー・メディア招請","_v":0}],"_v":1},{"f1":"成果","f2":"「また食べたい」「新鮮で日本らしい食体験ができた」など、味・鮮度・食感のすべてで高い評価を得ました。牡蠣は現地の日本食通から特に好評で、北寄貝は見た目の個性と使い道の広さが評価され、多国籍料理や新メニューへの展開が期待されています。現地のバイヤー・飲食店との新しいネットワークに加え、物流や現地の嗜好について、今後の戦略に生かせる知見を得ました。","_v":0},{"f1":"支援したステップ","f2":"/services/connect/","f3":"03 CONNECT","f4":[{"f1":"font-size: 19px; font-weight: 700;","f2":"現地とつなぐ","_v":0},{"f1":"font-size: 14px; color: #2E3D39;","f2":"代理店・ディストリビューター開拓、バイヤー商談、展示会・イベント、現地プロモーション","_v":0}],"_v":2}]}} /-->
