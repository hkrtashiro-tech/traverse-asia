<!-- wp:ta/work-5fa401 {"data":{"f1":[{"f1":"背景・課題","f2":"世界的な内食・中食需要の高まりを背景に、北海道は家庭向け水産加工品の輸出に本格的に取り組み始めています。これまでの主な輸出先以外に販路を広げるため、消費力と日本食人気の高い香港・台湾に注目。新しい市場でのブランド認知の拡大と、消費者ニーズの把握が目的でした。","_v":0},{"f1":"取り組み","f2":"香港・台湾の量販店（各2店舗）で7日間以上の販売イベントを行い、試食で直接魅力を伝えました。現地バイヤーを招いた商談会で新しい取引先を開拓し、インフルエンサーによるSNS発信と、オンラインストアの特設ページで販売を強化。アンケート調査で現地の嗜好と反応を集め、今後の商品開発や販促に生かせる形にまとめました。","f3":[{"f1":"量販店での販売イベント","_v":0},{"f1":"試食","_v":0},{"f1":"バイヤー商談会","_v":0},{"f1":"インフルエンサー発信","_v":0},{"f1":"EC特設ページ","_v":0},{"f1":"消費者アンケート","_v":0}],"_v":1},{"f1":"成果","f2":"両市場で販売は好調に推移し、日本食と北海道ブランドへの信頼と関心の高さを確認できました。試食とSNSで認知が広がり、オンライン販売も堅調でした。一方、香港と台湾では水産加工品の好みや購入の動機にはっきりした違いがあり、売れ筋にも市場ごとの傾向が見られました。各メーカーが現地向けの商品やマーケティングを考えるうえで役立つ知見になりました。","_v":0},{"f1":"支援したステップ","f2":[{"f1":"/services/market-design/","f2":"02 DESIGN","f3":[{"f1":"font-size: 19px; font-weight: 700;","f2":"市場を設計する","_v":0},{"f1":"font-size: 14px; color: #2E3D39;","f2":"市場調査、海外展開戦略、価格設計、販路・輸出スキーム設計、ローンチ","_v":0}],"_v":0},{"f1":"/services/connect/","f2":"03 CONNECT","f3":[{"f1":"font-size: 19px; font-weight: 700;","f2":"現地とつなぐ","_v":0},{"f1":"font-size: 14px; color: #2E3D39;","f2":"代理店・ディストリビューター開拓、バイヤー商談、展示会・イベント、現地プロモーション","_v":0}],"_v":0}],"_v":2}]}} /-->
