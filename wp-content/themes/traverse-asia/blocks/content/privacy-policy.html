<!-- wp:ta/privacy-policy-2 {"data":{"f1":"CONTENTS","f2":[{"f1":"\u003ca href=\"#a1\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第1条　個人情報\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a2\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第2条　個人情報の取得方法\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a3\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第3条　個人情報の利用目的\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a4\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第4条　利用目的の変更\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a5\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第5条　個人情報の第三者提供\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a6\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第6条　アクセス解析ツールとCookie\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a7\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第7条　個人情報の安全管理\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a8\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第8条　個人情報の開示\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a9\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第9条　個人情報の訂正・削除、利用停止\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a10\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第10条　プライバシーポリシーの変更\u003c/a\u003e","_v":0},{"f1":"\u003ca href=\"#a11\" style=\"color: #2E3D39; text-decoration: none;\"\u003e第11条　お問い合わせ窓口\u003c/a\u003e","_v":0}],"f3":"Traverse Asia合同会社（以下「当社」）は、当社のウェブサイトおよびサービスにおける個人情報の取扱いについて、次のとおりプライバシーポリシー（以下「本ポリシー」）を定めます。","f4":"01","f5":"第1条　個人情報","f6":"「個人情報」とは、個人情報保護法にいう「個人情報」を指し、生存する個人に関する情報であって、氏名、住所、電話番号、メールアドレス、その他の記述等により特定の個人を識別できる情報をいいます。","f7":"02","f8":"第2条　個人情報の取得方法","f9":"当社は、お問い合わせフォーム、資料請求、メール、商談・イベントでの名刺交換などを通じて、次の個人情報を取得することがあります。","f10":[{"f1":"氏名","_v":0},{"f1":"会社名・団体名、部署名、役職","_v":0},{"f1":"メールアドレス","_v":0},{"f1":"電話番号","_v":0},{"f1":"お問い合わせの内容（ご相談内容、対象の国・地域、検討時期など）","_v":0}],"f11":"03","f12":"第3条　個人情報の利用目的","f13":"当社は、取得した個人情報を次の目的で利用します。","f14":[{"f1":"お問い合わせへの回答、ご相談内容の確認のため","_v":0},{"f1":"お見積り、ご提案、契約の締結・履行など、当社サービスの提供のため","_v":0},{"f1":"会社案内などの資料をお送りするため","_v":0},{"f1":"当社のサービス、セミナー、お知らせなどをご案内するため","_v":0},{"f1":"重要なお知らせなど、必要に応じたご連絡のため","_v":0},{"f1":"上記の利用目的に付随する目的のため","_v":0}],"f15":"04","f16":"第4条　利用目的の変更","f17":"当社は、変更前の利用目的と関連性があると合理的に認められる場合に限り、利用目的を変更します。変更した場合は、変更後の目的を本ウェブサイトで公表します。","f18":"05","f19":"第5条　個人情報の第三者提供","f20":"当社は、次の場合を除き、あらかじめご本人の同意を得ることなく、個人情報を第三者に提供しません。","f21":[{"f1":"法令に基づく場合","_v":0},{"f1":"人の生命、身体または財産の保護のために必要がある場合であって、ご本人の同意を得ることが困難なとき","_v":0},{"f1":"公衆衛生の向上または児童の健全な育成の推進のために特に必要がある場合であって、ご本人の同意を得ることが困難なとき","_v":0},{"f1":"国の機関もしくは地方公共団体またはその委託を受けた者が法令の定める事務を遂行することに協力する必要がある場合であって、ご本人の同意を得ることにより当該事務の遂行に支障を及ぼすおそれがあるとき","_v":0}],"f22":"なお、利用目的の達成に必要な範囲で個人情報の取扱いを委託する場合や、事業の承継に伴って個人情報が提供される場合は、第三者への提供には当たりません。","f23":"06","f24":"第6条　アクセス解析ツールとCookie","f25":[{"f1":"当社のウェブサイトでは、利用状況を把握し、サイトを改善するために、Google LLCが提供するアクセス解析ツール「Googleアナリティクス」を利用しています。Googleアナリティクスは、Cookieを使って、個人を特定しない形で利用状況のデータを収集します。","_v":0},{"f1":"Cookieはブラウザの設定で無効にすることができます。データの収集や処理の仕組みについては、Googleのポリシーと規約をご確認ください。","_v":0}],"f26":"07","f27":"第7条　個人情報の安全管理","f28":"当社は、個人情報の漏えい、滅失、毀損を防ぐため、必要かつ適切な安全管理措置を講じます。個人情報の取扱いを委託する場合は、委託先に対して必要かつ適切な監督を行います。","f29":"08","f30":"第8条　個人情報の開示","f31":"当社は、ご本人から個人情報の開示を求められたときは、ご本人であることを確認したうえで、遅滞なく開示します。ただし、開示することでご本人または第三者の権利利益を害するおそれがある場合、当社の業務の適正な実施に著しい支障を及ぼすおそれがある場合、その他法令に違反することとなる場合は、全部または一部を開示しないことがあります。その場合は、遅滞なくその旨をお知らせします。","f32":"09","f33":"第9条　個人情報の訂正・削除、利用停止","f34":[{"f1":"ご本人は、当社が保有するご自身の個人情報が事実と異なる場合、訂正、追加または削除を求めることができます。また、利用目的の範囲を超えて取り扱われている場合や、不正な手段で取得された場合には、利用の停止または消去を求めることができます。","_v":0},{"f1":"当社は、ご請求を受けた場合は遅滞なく必要な調査を行い、その結果に基づいて対応し、対応の内容をご本人にお知らせします。","_v":0}],"f35":"10","f36":"第10条　プライバシーポリシーの変更","f37":"本ポリシーの内容は、法令その他本ポリシーに別段の定めのある事項を除き、変更することがあります。変更後のプライバシーポリシーは、本ウェブサイトに掲載した時点から効力を生じます。","f38":"11","f39":"第11条　お問い合わせ窓口","f40":"本ポリシーに関するお問い合わせは、次の窓口までお願いします。","f41":[{"f1":"事業者名","f2":"Traverse Asia合同会社","_v":0},{"f1":"所在地","f2":"〒053-0842 北海道苫小牧市有珠の沢町1-13-8","_v":0},{"f1":"代表者","f2":"玉村 嘉崇","_v":0},{"f1":"メール","f2":"contact@traverse-asia.com","_v":0}],"f42":"制定日：【制定日】\u003cbr/\u003e最終改定日：2026年【月日】"}} /-->
